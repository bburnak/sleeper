# Sleeper configuration
# Copy to config.yaml and adjust as needed.

# Path to directory containing MP3 story files
stories_dir: ~/stories

# Noise type: white, brown, or pink
noise_type: brown

# Default volumes (0-100)
noise_volume: 30
story_volume: 60

# Time to stop noise (24h format HH:MM)
stop_time: "07:00"

# Minutes before stop_time to begin fading noise out
fade_out_minutes: 5

# Seconds for story → noise crossfade
crossfade_seconds: 10

# Fraction of story that must play to count as "listened" (0.0-1.0)
listened_threshold: 0.10

# Volume adjustment step per hotkey press (percentage points)
volume_step: 5

# Input backend: gamepad, gpio, or keyboard
input_backend: gamepad

# Input device path, or "auto" to auto-detect
input_device: auto

# ALSA audio output device (use "default" for system default, "bluealsa" for Bluetooth)
audio_output: bluealsa

# Screen power management (pygame display backend only).
# Seconds of touch/input inactivity before the LCD backlight turns off.
# Set to 0 to keep the screen on permanently.
screen_idle_timeout: 60
# sysfs bl_power file; "auto" picks the first /sys/class/backlight/*/bl_power.
screen_backlight_path: auto

# Path to play history file
history_file: ~/.sleeper/history.json

# How long a button must be held for a "long press" (seconds)
long_press_seconds: 1.5

# Gamepad button mapping: evdev key code -> action name
# Action names: start_story, skip, pause_resume, stop, volume_up, volume_down
# "skip" short press = next story, long press = skip to noise
# "stop" requires long press
gamepad_mapping:
  315: start_story    # BTN_START
  307: skip           # BTN_NORTH (triangle)
  304: pause_resume   # BTN_SOUTH (cross)
  314: stop           # BTN_SELECT
  544: volume_up      # BTN_DPAD_UP
  545: volume_down    # BTN_DPAD_DOWN

# Keyboard mapping (for development/testing with input_backend: keyboard)
keyboard_mapping:
  28: start_story     # KEY_ENTER
  49: skip            # KEY_N
  57: pause_resume    # KEY_SPACE
  16: stop            # KEY_Q

# GPIO pin mapping (for input_backend: gpio)
gpio_pins:
  start_story: 17
  skip: 27
  volume_up: 22
  volume_down: 23
  pause_resume: 24
  stop: 25
